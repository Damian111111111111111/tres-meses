<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tres meses de nosotros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Caveat:wght@600&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
/* Layout: un reproductor tipo serie. Escenario SVG arriba, subtítulo grande abajo, episodios como capítulos.
   Paleta: noche violeta de fondo, ámbar para Damián, rosa para Yuzuri. */
:root{
  --bg:#0e0a1c;
  --panel:#171229;
  --ink:#f7efe6;
  --muted:#b9acc9;
  --amber:#ffb547;
  --rose:#ff7fa8;
  --line:rgba(255,255,255,.14);
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mark{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase}
.for{font-family:var(--hand);font-size:1.5rem;color:var(--rose)}

.player{display:flex;flex-direction:column;gap:16px}
.stage{position:relative;aspect-ratio:8/5;border-radius:14px;overflow:hidden;background:#150a2e;box-shadow:0 30px 60px -30px rgba(0,0,0,.8),0 0 0 1px var(--line)}
@media(max-width:600px){.stage{aspect-ratio:4/3}}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.segs{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:3;pointer-events:none}
.seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.seg b{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.seg.done b{transform:scaleX(1)}
.seg.cur b{animation:fill var(--dur) linear forwards}
.seg.hold b{animation:none;transform:scaleX(1)}
.player.paused .seg.cur b{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.tap{position:absolute;top:0;bottom:0;background:none;border:0;z-index:2;padding:0}
.tap.prev{left:0;width:35%}.tap.next{right:0;width:65%}

.intro{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 55%,rgba(14,10,28,.55),rgba(14,10,28,.88))}
.intro[hidden]{display:none}
.intro h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,13vw,7.5rem);line-height:.9;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.intro h1 span{display:block;color:var(--amber)}
.intro p{margin:0;font-family:var(--hand);font-size:clamp(1.4rem,3.6vw,2rem);color:var(--rose)}
.go{margin-top:10px;background:var(--amber);color:#2a1606;border:0;border-radius:999px;padding:12px 30px;font-weight:600;font-size:1.05rem;transition:transform .15s}
.go:hover{transform:scale(1.04)}
.hint{font-size:.85rem;color:var(--muted)}

.cap{display:grid;gap:8px;min-height:7.5rem}
.tag{margin:0;font-family:var(--hand);font-size:1.5rem;color:var(--amber);line-height:1.1}
.line{margin:0;font-size:clamp(1.15rem,2.8vw,1.5rem);line-height:1.45;max-width:60ch;text-wrap:pretty}
.cap.swap .tag,.cap.swap .line{animation:up .7s ease both}
.cap.swap .line{animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.ic:hover{border-color:var(--amber)}
.ic[disabled]{opacity:.35;cursor:default}
.ic svg{width:18px;height:18px;fill:currentColor}
.pos{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.replay{background:none;border:1px solid var(--rose);color:var(--rose);border-radius:999px;padding:8px 18px}
.replay[hidden]{display:none}

.eps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.eps{grid-template-columns:1fr}}
.ep{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.ep small{font-family:var(--hand);font-size:1.25rem;color:var(--muted);line-height:1}
.ep strong{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.ep[aria-current="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.ep[aria-current="true"] small{color:var(--amber)}
.foot{text-align:center;color:var(--muted);font-family:var(--hand);font-size:1.3rem;margin-top:8px}

/* animaciones del escenario */
#svg text{font-family:var(--body)}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:bub 6s ease-in-out infinite}
@keyframes bub{0%{opacity:0;transform:scale(.2)}8%{opacity:1;transform:scale(1.08)}12%{transform:scale(1)}42%{opacity:1}52%,100%{opacity:0;transform:scale(.9)}}
.floatup{animation:floatup 5s ease-out infinite}
@keyframes floatup{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-130px)}}
.dash{animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-38}}
.drop{animation:drop 1s linear infinite}
@keyframes drop{from{transform:translateY(-30px)}to{transform:translateY(520px)}}
.cloud{animation:cloud 9s ease-in-out infinite alternate}
@keyframes cloud{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.15}50%{transform:scale(1.25);opacity:.4}}
.neon{animation:neon 4s steps(1) infinite}
@keyframes neon{0%,100%{opacity:1}30%{opacity:1}31%{opacity:.5}32%{opacity:1}70%{opacity:1}71%{opacity:.6}73%{opacity:1}}
.beam{animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq .9s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.bolt{animation:bolt 5s linear infinite;opacity:0}
.flash{animation:flash 5s linear infinite;opacity:0}
@keyframes bolt{0%,91%,100%{opacity:0}92%{opacity:1}93%{opacity:0}94%{opacity:.9}97%{opacity:0}}
@keyframes flash{0%,91%,100%{opacity:0}92%{opacity:.55}93%{opacity:0}94%{opacity:.35}97%{opacity:0}}
.fadein{animation:fadein 1.2s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.walkL{animation:walkL 6s ease-in-out forwards}
.walkR{animation:walkR 6s ease-in-out forwards}
@keyframes walkL{from{transform:translate(0,0)}to{transform:translate(190px,78px)}}
@keyframes walkR{from{transform:translate(0,0)}to{transform:translate(-190px,78px)}}
.closeL{animation:closeL 5s ease-in-out forwards}
.closeR{animation:closeR 5s ease-in-out forwards}
@keyframes closeL{from{transform:translateX(-90px)}to{transform:none}}
@keyframes closeR{from{transform:translateX(90px)}to{transform:none}}
.slide{animation:slide 1.4s .9s ease-out both}
@keyframes slide{from{transform:translateY(0)}to{transform:translateY(-135px)}}
.flap{transform-box:fill-box;transform-origin:50% 0;animation:flap .8s .3s ease-in-out forwards}
@keyframes flap{to{transform:scaleY(-1)}}
.rise{animation:rise 6s ease-out both}
@keyframes rise{from{transform:translateY(90px)}to{transform:none}}
.sceneIn{animation:sceneIn .8s ease both}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #svg *{animation:none!important}
  #svg .dr{stroke-dashoffset:0!important}
  .seg.cur b{animation:none!important;transform:scaleX(1)}
  .cap.swap .tag,.cap.swap .line{animation:none}
}
</style>

<div class="wrap">
  <header class="top"><span class="mark">Tres meses</span><span class="for">para Yuzuri</span></header>

  <section class="player paused" id="player" aria-label="Serie animada">
    <div class="stage" id="stage">
      <svg id="svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label=""></svg>
      <div class="segs" id="segs"></div>
      <button class="tap prev" id="tapPrev" aria-label="Escena anterior"></button>
      <button class="tap next" id="tapNext" aria-label="Escena siguiente"></button>
      <div class="intro" id="intro">
        <p>Una serie en tres episodios</p>
        <h1>Tres meses <span>de nosotros</span></h1>
        <button class="go" id="go">Ver la serie</button>
        <span class="hint">Se disfruta más con música de fondo</span>
      </div>
    </div>

    <div class="cap" id="cap">
      <p class="tag" id="tag"></p>
      <p class="line" id="line"></p>
    </div>

    <div class="ctrls">
      <button class="ic" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ic" id="play" aria-label="Pausar"><svg viewBox="0 0 24 24" id="playIcon"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
      <button class="ic" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
      <button class="replay" id="replay" hidden>Verla de nuevo</button>
      <span class="pos" id="pos"></span>
    </div>

    <nav class="eps" id="eps" aria-label="Episodios"></nav>
  </section>

  <p class="foot">Hecho a mano por Damián, para Yuzuri.</p>
</div>

<script>
(function(){
'use strict';
const SONGS={1:'',2:'',3:''}; // canción de fondo sugerida por episodio; si se completa, aparece en el subtítulo
const AMB='#ffb547',AMBD='#b9731a',ROS='#ff7fa8',ROSD='#a63a68';
const SHORT='M-18 -2 Q-19 -22 0 -21 Q19 -22 18 -2 Q10 -12 0 -10 Q-10 -12 -18 -2Z';
const LONG='M-19 0 Q-21 -23 0 -22 Q21 -23 19 0 L21 26 Q15 28 14 21 L13 0 Q0 -14 -13 0 L-14 21 Q-15 28 -21 26Z';

function lcg(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function stars(n,seed,maxY){const r=lcg(seed);let o='';for(let i=0;i<n;i++){o+=`<circle class="tw" cx="${(r()*800).toFixed(0)}" cy="${(r()*maxY).toFixed(0)}" r="${(0.8+r()*1.5).toFixed(1)}" fill="#fff" style="animation-delay:${(r()*3).toFixed(1)}s"/>`}return o}
function heart(x,y,s,f){return `<path d="M0 -4 C-8 -14 -22 -2 0 14 C22 -2 8 -14 0 -4Z" transform="translate(${x} ${y}) scale(${s})" fill="${f}"/>`}
function envelope(){return `<rect x="-11" y="-7" width="22" height="15" rx="2" fill="#fff4dc"/><path d="M-11 -7 L0 2 L11 -7" stroke="${AMBD}" stroke-width="1.5" fill="none"/>`}
function rain(n,seed,op){const r=lcg(seed);let o=`<g opacity="${op}" stroke="#bcd6ff" stroke-width="1.4" stroke-linecap="round">`;for(let i=0;i<n;i++){const x=r()*800;o+=`<line class="drop" x1="${x.toFixed(0)}" y1="0" x2="${(x-5).toFixed(0)}" y2="16" style="animation-duration:${(0.7+r()*0.6).toFixed(2)}s;animation-delay:-${(r()*2).toFixed(2)}s"/>`}return o+'</g>'}
function cloud(x,y,s,c,op=1){return `<g class="cloud" opacity="${op}"><g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><ellipse cx="0" cy="0" rx="60" ry="22"/><circle cx="-24" cy="-14" r="24"/><circle cx="14" cy="-24" r="30"/><circle cx="40" cy="-8" r="20"/></g></g>`}
function notes(list,col='#fff'){return list.map((n,i)=>`<text class="floatup" x="${n[0]}" y="${n[1]}" font-size="${n[2]||26}" fill="${col}" style="animation-delay:${(n[3]!==undefined?n[3]:i*0.9)}s">${n[4]||(i%2?'♫':'♪')}</text>`).join('')}

function defs(sky,orbC){return `<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
<radialGradient id="og"><stop offset="0" stop-color="${orbC}" stop-opacity=".8"/><stop offset="1" stop-color="${orbC}" stop-opacity="0"/></radialGradient>
<linearGradient id="beamg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`}
function orbSvg(o){if(!o)return '';let s=`<g class="${o.pulse?'pulse':''}"><circle cx="${o.x}" cy="${o.y}" r="${o.r*2.8}" fill="url(#og)"/></g><circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${o.c}"/>`;
  if(o.moon)s+=`<g fill="#000" opacity=".08"><circle cx="${o.x-o.r*.3}" cy="${o.y-o.r*.2}" r="${o.r*.22}"/><circle cx="${o.x+o.r*.35}" cy="${o.y+o.r*.3}" r="${o.r*.16}"/><circle cx="${o.x+o.r*.1}" cy="${o.y-o.r*.5}" r="${o.r*.1}"/></g>`;return s}
function hillsSvg(h){return `<path d="M0 400 C100 320 220 320 330 400 C360 425 440 425 470 400 C580 320 700 320 800 400 L800 500 L0 500Z" fill="${h[0]}"/><path d="M0 470 C200 440 600 440 800 470 L800 500 L0 500Z" fill="${h[1]}"/>`}
function base(o){return defs(o.sky,o.orb?o.orb.c:'#fff')+`<rect width="800" height="500" fill="url(#sky)"/>`+(o.stars?`<g opacity="${o.stars}">${stars(80,o.seed||7,270)}</g>`:'')+orbSvg(o.orb)+(o.mid||'')+(o.hills===false?'':hillsSvg(o.hc||['#2b1236','#1d0b27']))}

function person(o){
  const {x,y,s=1,flip=1,c,cd,hair='short',tilt=0,arm=null,sit=false,phone=null,hp=false}=o;
  const bh=sit?.7:1,hy=-58*bh-13;
  let g=`<g transform="translate(${x} ${y}) scale(${s*flip} ${s})">`;
  if(sit)g+=`<ellipse cx="16" cy="-6" rx="24" ry="7" fill="${cd}"/>`;
  g+=`<path d="M-16 0 L-15 -40 Q-14 -58 0 -58 Q14 -58 15 -40 L16 0Z" fill="${c}" transform="scale(1 ${bh})"/>`;
  if(arm){const sy=-46*bh;g+=`<line x1="0" y1="${sy}" x2="${arm.x}" y2="${arm.y}" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`;
    if(phone)g+=`<circle class="pulse" cx="${arm.x}" cy="${arm.y-6}" r="14" fill="${phone}" opacity=".25"/><rect x="${arm.x-4}" y="${arm.y-13}" width="9" height="15" rx="2" fill="${phone}"/>`}
  g+=`<g transform="translate(0 ${hy}) rotate(${tilt} 0 14)"><circle r="17" fill="${c}"/><path d="${hair==='long'?LONG:SHORT}" fill="${cd}"/>`;
  if(hp)g+=`<path d="M-20 4 Q-21 -25 0 -25 Q21 -25 20 4" stroke="#1d1530" stroke-width="4" fill="none"/><rect x="-25" y="-2" width="9" height="15" rx="3" fill="#1d1530"/><rect x="16" y="-2" width="9" height="15" rx="3" fill="#1d1530"/>`;
  return g+'</g></g>';
}
const D=(o={})=>person({x:161,y:340,c:AMB,cd:AMBD,hair:'short',arm:{x:30,y:-62},...o});
const Y=(o={})=>person({x:639,y:340,flip:-1,c:ROS,cd:ROSD,hair:'long',arm:{x:30,y:-62},...o});

function thread(o={}){const {sag=40,col='#ffd9a0',w=2.5,op=.9,flow=true,trav=[]}=o;
  const d=`M191 278 Q400 ${278+sag*2} 609 278`;
  let s=`<path id="thr" d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
  if(flow)s+=`<path class="dash" d="${d}" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="3 16" opacity=".7"/>`;
  trav.forEach(t=>{s+=`<g>${t.k==='env'?envelope():heart(0,0,t.s||.6,t.c||ROS)}<animateMotion dur="${t.dur}s" begin="-${t.b}s" repeatCount="indefinite" ${t.rev?'keyPoints="1;0" keyTimes="0;1" calcMode="linear"':''}><mpath href="#thr"/></animateMotion></g>`});
  return s}
function bubble(x,y,w,flip,delay,content){
  return `<g class="pop" style="animation-delay:${delay}s"><rect x="${x}" y="${y}" width="${w}" height="46" rx="14" fill="#fff" opacity=".95"/><path d="M${flip>0?x+16:x+w-16} ${y+44} l${flip>0?-6:6} 14 l${flip>0?20:-20} -14Z" fill="#fff" opacity=".95"/>${content(x,y,w)}</g>`}
const chatLines=(c1)=>(x,y,w)=>`<rect x="${x+14}" y="${y+12}" width="${w*.55}" height="6" rx="3" fill="${c1}"/><rect x="${x+14}" y="${y+24}" width="${w*.4}" height="6" rx="3" fill="${c1}" opacity=".6"/>`;
const glyph=(t,c)=>(x,y,w)=>`<text x="${x+w/2}" y="${y+35}" text-anchor="middle" font-size="30" font-weight="700" fill="${c}">${t}</text>`;

/* ---------- escenas ---------- */
const P1={sky:['#241046','#ff7a59'],hc:['#2b1236','#1d0b27']};
const P2={sky:['#0f1b2e','#4a6a8a'],hc:['#16263a','#0d1826']};

function titleCard(n,mes,name,pal,orb,extra){return ()=>base({...pal,orb,stars:.9,mid:extra||''})+
  `<g text-anchor="middle"><text class="fadein" x="400" y="170" font-family="Caveat" font-size="42" font-weight="600" fill="${AMB}">Episodio ${n} · ${mes}</text>
   <text class="fadein" x="400" y="275" font-family="Big Shoulders Display" font-weight="800" font-size="92" letter-spacing="4" fill="#fff" style="animation-delay:.4s;text-transform:uppercase">${name.toUpperCase()}</text></g>`}

const EPS=[
{n:1,mes:'Mes 1',name:'Sin parar',scenes:[
 {dur:4,cap:'El primer mes: conocernos a toda velocidad.',draw:titleCard(1,'Mes 1','Sin parar',P1,{x:400,y:330,r:46,c:'#ffd08a',pulse:true})},
 {cap:'Todo empezó en Sherwood. Dos personas que se cruzaron, y algo que ya no tenía vuelta atrás.',draw:()=>{
   const beams=[[170,'#ff7fa8'],[400,'#ffb547'],[630,'#9d8cff']].map((b,i)=>`<polygon class="beam" points="${b[0]-14},0 ${b[0]+14},0 ${b[0]+110},440 ${b[0]-110},440" fill="url(#beamg)" style="transform-origin:${b[0]}px 0px;animation-delay:-${i*2}s"/>`).join('');
   const r=lcg(11);let crowd='';for(let i=0;i<16;i++){const x=20+i*50+r()*14,h=26+r()*16;crowd+=`<path d="M${x-13} 500 L${x-12} ${470-h*.3} Q${x} ${462-h*.5} ${x+12} ${470-h*.3} L${x+13} 500Z" fill="#0c0516"/><circle cx="${x}" cy="${454-h*.5}" r="11" fill="#0c0516"/>`}
   return base({sky:['#150a2e','#5b1a5e'],stars:.5,hills:false,mid:beams+`<rect x="0" y="438" width="800" height="62" fill="#12071f"/>`})+
   `<g class="neon" filter="url(#glow)"><rect x="228" y="92" width="344" height="86" rx="10" fill="none" stroke="${ROS}" stroke-width="4"/><text x="400" y="154" text-anchor="middle" font-family="Big Shoulders Display" font-weight="800" font-size="68" letter-spacing="8" fill="#ffe3f0">SHERWOOD</text></g>`+
   `<g class="closeL">${person({x:310,y:446,s:1.15,c:AMB,cd:AMBD,hair:'short'})}</g><g class="closeR">${person({x:490,y:446,s:1.15,flip:-1,c:ROS,cd:ROSD,hair:'long'})}</g>`+crowd+
   notes([[120,330,22,0],[680,340,22,1.5],[250,300,20,3],[560,290,20,2.2]],'#ffd9ec')}},
 {cap:'Y desde ese momento no paramos de hablar. Había tanto para contarse que el día nunca alcanzaba.',draw:()=>base({sky:['#2a1250','#ff7a59'],orb:{x:400,y:330,r:40,c:'#ffd08a',pulse:true},stars:.6,hills:false,mid:`<rect x="0" y="440" width="800" height="60" fill="#1d0b27"/>`})+

/* ---------- reproductor ---------- */
const $=s=>document.querySelector(s);
const player=$('#player'),svg=$('#svg'),segs=$('#segs'),cap=$('#cap'),tag=$('#tag'),line=$('#line'),pos=$('#pos'),epsEl=$('#eps');
let st={ep:0,i:0},playing=false,started=false;

epsEl.innerHTML=EPS.map((e,k)=>`<button class="ep" data-k="${k}"><small>Ep. ${e.n} · ${e.mes}</small><strong>${e.name}</strong></button>`).join('');
epsEl.addEventListener('click',e=>{const b=e.target.closest('.ep');if(b){begin();go(+b.dataset.k,0)}});

function render(){
  const e=EPS[st.ep],sc=e.scenes[st.i];
  svg.innerHTML=`<g class="sceneIn">${sc.draw()}</g>`;
  svg.setAttribute('aria-label',sc.cap);
  tag.textContent=`${e.mes} · ${e.name}`+(SONGS[e.n]?` · ♪ ${SONGS[e.n]}`:'');
  line.textContent=sc.cap;
  cap.classList.remove('swap');void cap.offsetWidth;cap.classList.add('swap');
  const dur=sc.dur||7;
  segs.innerHTML=e.scenes.map((s,k)=>`<i class="seg ${k<st.i?'done':k===st.i?(sc.final?'hold':'cur'):''}" ${k===st.i?`style="--dur:${dur}s"`:''}><b></b></i>`).join('');
  pos.textContent=`Ep. ${e.n} · ${st.i+1} de ${e.scenes.length}`;
  [...epsEl.children].forEach((b,k)=>b.setAttribute('aria-current',k===st.ep?'true':'false'));
  $('#replay').hidden=!sc.final;
  $('#prev').disabled=(st.ep===0&&st.i===0);
  $('#next').disabled=!!sc.final;
  if(started){try{history.replaceState(null,'','#ep'+e.n)}catch(_){}}
}
function go(ep,i){st.ep=ep;st.i=i;render()}
function next(){const e=EPS[st.ep];if(st.i<e.scenes.length-1)go(st.ep,st.i+1);else if(st.ep<EPS.length-1)go(st.ep+1,0)}
function prev(){if(st.i>0)go(st.ep,st.i-1);else if(st.ep>0)go(st.ep-1,EPS[st.ep-1].scenes.length-1)}
function setPlay(p){playing=p;player.classList.toggle('paused',!p);
  $('#playIcon').innerHTML=p?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M7 4l13 8-13 8z"/>';
  $('#play').setAttribute('aria-label',p?'Pausar':'Reproducir')}
function begin(){if(started)return;started=true;$('#intro').hidden=true;setPlay(!matchMedia('(prefers-reduced-motion: reduce)').matches)}
function fromHash(){const m=/^#ep([1-3])$/.exec(location.hash);return m?+m[1]-1:0}

segs.addEventListener('animationend',e=>{if(e.animationName==='fill'&&playing)next()});
$('#tapNext').onclick=next;$('#tapPrev').onclick=prev;$('#next').onclick=next;$('#prev').onclick=prev;
$('#play').onclick=()=>setPlay(!playing);
$('#replay').onclick=()=>go(0,0);
$('#go').onclick=()=>{begin();go(fromHash(),0)};
document.addEventListener('keydown',e=>{if(!started)return;if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key===' '&&e.target===document.body){e.preventDefault();setPlay(!playing)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlay(false)});
window.addEventListener('hashchange',()=>{const k=fromHash();if(started&&k!==st.ep)go(k,0)});

go(0,3);  // fondo de la portada: el hilo entre los dos
})();
</script>
